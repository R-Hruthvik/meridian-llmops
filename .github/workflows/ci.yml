name: Meridian LLMOps CI/CD Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_real_llm_eval:
        description: Run the real LLM quality evaluation (requires EVAL_LLM_API_KEY)
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff & Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Run Mypy
        run: uv run --frozen mypy --explicit-package-bases packages services evals --ignore-missing-imports

  backend:
    name: Backend Tests & Retrieval Evaluation
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      API_KEY_SECRET: meridian-test-secret-key-2026
      MERIDIAN_API_KEY: meridian-test-secret-key-2026
      QDRANT_URL: http://localhost:6333
    services:
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache FastEmbed model
        uses: actions/cache@v4
        with:
          path: storage/fastembed
          key: ${{ runner.os }}-fastembed-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit, integration, and offline generation tests
        run: uv run --frozen pytest tests/ evals/ -v

      - name: Run route-auth enumeration regression
        run: >-
          uv run --frozen pytest tests/test_phase5_auth.py
          -k every_rag_and_gateway_route_is_authenticated_except_health -v

      - name: Evaluate retrieval quality
        run: uv run --frozen python evals/eval_retrieval.py

  frontend:
    name: Frontend Tests & Secret-Free Build
    runs-on: ubuntu-latest
    env:
      API_KEYS: '{"phase5-ci-configured-key-a91b":{"tenant":"default","role":"admin"}}'
      ADMIN_API_KEY: phase5-ci-admin-key-51c0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run Vitest
        run: npm --prefix web run test:run

      - name: Build frontend
        run: npm --prefix web run build

      - name: Check built assets for API keys
        run: |
          if grep -R -q -F 'dev-key-change-me' web/dist \
            || grep -R -q -F 'meridian-test-secret-key-2026' web/dist \
            || grep -R -q -F 'phase5-ci-configured-key-a91b' web/dist \
            || grep -R -q -F 'phase5-ci-admin-key-51c0' web/dist \
            || grep -R -q -E 'phase5-ci-(configured|admin)-key-[A-Za-z0-9]+' web/dist; then
            echo 'Frontend build contains an API key value or configured-key pattern.'
            exit 1
          fi

  security:
    name: Auth Regression & Informational Dependency Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Enumerate route auth dependencies
        env:
          APP_ENV: testing
          API_KEYS: '{"phase5-ci-configured-key-a91b":{"tenant":"default","role":"admin"}}'
          ADMIN_API_KEY: phase5-ci-admin-key-51c0
        run: >-
          uv run --frozen pytest tests/test_phase5_auth.py
          -k every_rag_and_gateway_route_is_authenticated_except_health -v

      - name: Run pip-audit (informational)
        continue-on-error: true
        run: uv run --frozen --with pip-audit pip-audit

      - name: Run npm audit (informational)
        continue-on-error: true
        run: npm audit --prefix web --audit-level=moderate

  real-llm-eval:
    name: Scheduled or Manual Real LLM Quality Evaluation
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_real_llm_eval)
    runs-on: ubuntu-latest
    env:
      EVAL_LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Skip real evaluation when the API key is unavailable
        if: env.EVAL_LLM_API_KEY == ''
        run: "echo 'Real LLM evaluation skipped: configure EVAL_LLM_API_KEY to enable it.'"

      - name: Run DeepEval quality evaluation
        if: env.EVAL_LLM_API_KEY != ''
        run: uv run --frozen python evals/eval_generation.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-eval-report
          path: evals/reports/*.json
          if-no-files-found: ignore
