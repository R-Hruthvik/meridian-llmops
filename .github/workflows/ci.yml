name: Meridian LLMOps CI/CD Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Tests & Secret-Free Build
    runs-on: ubuntu-latest
    env:
      API_KEYS: '{"phase5-ci-configured-key-a91b":{"tenant":"default","role":"admin"}}'
      ADMIN_API_KEY: phase5-ci-admin-key-51c0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Run frontend tests
        run: npm --prefix web run test:run

      - name: Build frontend
        run: npm --prefix web run build

      - name: Check built assets for API keys
        run: |
          if grep -R -q -F 'dev-key-change-me' web/dist \
            || grep -R -q -F 'meridian-test-secret-key-2026' web/dist \
            || grep -R -q -F 'phase5-ci-configured-key-a91b' web/dist \
            || grep -R -q -F 'phase5-ci-admin-key-51c0' web/dist \
            || grep -R -q -E 'phase5-ci-(configured|admin)-key-[A-Za-z0-9]+' web/dist; then
            echo 'Frontend build contains an API key value or configured-key pattern.'
            exit 1
          fi

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Typechecker
        run: mypy packages services evals --ignore-missing-imports

  test-and-evaluate:
    name: Unit, Integration & DeepEval CI Gate
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      API_KEY_SECRET: meridian-test-secret-key-2026
      MERIDIAN_API_KEY: meridian-test-secret-key-2026
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Suite & DeepEval Golden Dataset Gate
        env:
          APP_ENV: testing
          API_KEY_SECRET: meridian-test-secret-key-2026
          MERIDIAN_API_KEY: meridian-test-secret-key-2026
        run: |
          pytest tests/ evals/ -v
